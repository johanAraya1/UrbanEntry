# ============================================
# URBANENTRY - CONFIGURACIÓN PRODUCCIÓN
# ============================================

# Base de datos - Usar variables de entorno en producción
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urbanentry_db}
spring.datasource.username=${DB_USERNAME:urbanentry_user}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT - DEBE ser variable de entorno
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS - Especificar dominio exacto
cors.allowed.origins=${CORS_ORIGINS:https://yourdomain.com}

# Email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
urbanentry.mail.from=${MAIL_FROM:noreply@urbanentry.local}

# Logging
logging.level.root=WARN
logging.level.com.urbanentry=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=/var/log/urbanentry/application.log
logging.file.max-size=10MB
logging.file.max-history=30

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
