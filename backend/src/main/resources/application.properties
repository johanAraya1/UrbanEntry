# ============================================
# URBANENTRY - CONFIGURACIÓN DESARROLLO
# ============================================

# Perfil activo
spring.profiles.active=dev

# Información de la aplicación
spring.application.name=UrbanEntry
server.port=8080

# Encoding UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ============================================
# BASE DE DATOS - PostgreSQL
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/urbanentry_db?characterEncoding=UTF-8&useUnicode=true&ApplicationName=UrbanEntry
spring.datasource.username=urbanentry_user
spring.datasource.password=urbanentry_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET CLIENT_ENCODING TO 'UTF8'

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ============================================
# JWT CONFIGURACIÓN
# ============================================
# IMPORTANTE: Cambiar en producción con una clave fuerte de 256 bits
jwt.secret=UrbanEntry2026SecureKeyChangeInProductionMinimum256BitsRequired!
jwt.expiration=86400000
# 86400000 ms = 24 horas

# ============================================
# SEGURIDAD
# ============================================
# BCrypt strength (10-12 recomendado)
password.encoder.strength=12

# CORS permitidos (en producción especificar dominios exactos)
cors.allowed.origins=http://localhost:3000,http://localhost:8081,https://localhost:3000,https://localhost:8081

# ============================================
# EMAIL CONFIGURACIÓN (JavaMail)
# ============================================
# Gmail example (para desarrollo)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email del sistema
urbanentry.mail.from=noreply@urbanentry.local
urbanentry.mail.enabled=true

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.urbanentry=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# JACKSON (JSON)
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Costa_Rica

# ============================================
# MULTIPART (File Upload) - Por si en el futuro
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# ACTUATOR (Monitoring)
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ============================================
# SCHEDULED TASKS
# ============================================
# Cron para expirar visitas: cada día a las 00:00
urbanentry.cron.expire-visits=0 0 0 * * ?

# Cron para limpiar notificaciones viejas: domingos a las 03:00
urbanentry.cron.clean-notifications=0 0 3 ? * SUN
